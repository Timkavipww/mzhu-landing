      id="mz-glow"
      cx="310"
      cy="280"
      r="360"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#3ee0c8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ee0c8" stop-opacity="0"/>
    </radialGradient>

    <!-- Housing hatch -->
    <pattern
      id="mz-hatch"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <line
        x1="0"
        y1="0"
        x2="0"
        y2="8"
        stroke="#a9b6c3"
        stroke-opacity="0.08"
        stroke-width="2"
      />
    </pattern>

