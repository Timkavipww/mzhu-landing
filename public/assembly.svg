  <defs>
    <!-- Shaft -->
    <linearGradient
      id="mz-shaft"
      x1="0"
      y1="254"
      x2="0"
      y2="306"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#d5dde5"/>
      <stop offset="0.18" stop-color="#9eabb8"/>
      <stop offset="0.5" stop-color="#5d6a77"/>
      <stop offset="0.82" stop-color="#8d9aa7"/>
      <stop offset="1" stop-color="#4a5560"/>
    </linearGradient>

    <linearGradient
      id="mz-shaft-fade"
      x1="-260"
      y1="0"
      x2="160"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>

    <mask
      id="mz-shaft-mask"
      maskUnits="userSpaceOnUse"
      x="-2000"
      y="0"
      width="5000"
      height="560"
    >
      <rect
        x="-2000"
        y="0"
        width="5000"
        height="560"
        fill="url(#mz-shaft-fade)"
      />
    </mask>

    <!-- Steel -->
    <linearGradient
      id="mz-steel"
      x1="0"
      y1="96"
      x2="0"
      y2="240"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#303a45"/>
      <stop offset="1" stop-color="#1f2730"/>
    </linearGradient>

    <!-- Magnet -->
    <linearGradient
      id="mz-magnet"
      x1="230"
      y1="0"
      x2="390"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#3a4048"/>
      <stop offset="0.5" stop-color="#4c535c"/>
      <stop offset="1" stop-color="#3a4048"/>
    </linearGradient>

    <!-- Magnetic fluid -->
    <linearGradient
      id="mz-fluid"
      x1="0"
      y1="240"
      x2="0"
      y2="254"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#3ee0c8"/>
      <stop offset="1" stop-color="#1f9e8c"/>
    </linearGradient>

